<div class="sticky" id="sticky"><a href="{{app_url}}" data-cta="sticky">{{btnhead}} &middot; free</a></div>
<script>
(function(){
var slug="{{slug}}",medium="{{medium}}";
document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[data-cta]");if(!a)return;
try{window.posthog&&posthog.capture("guide_cta_click",{slug:slug,utm_medium:medium,position:a.getAttribute("data-cta"),style:a.getAttribute("data-style")||undefined},{send_instantly:true})}catch(x){}});
var s=document.getElementById("sticky"),seen=new Set();
if(s){var f=function(){if(window.scrollY>140&&seen.size===0)s.classList.add("on");else s.classList.remove("on")};window.addEventListener("scroll",f,{passive:true});f();
if("IntersectionObserver"in window){var io=new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting)seen.add(x.target);else seen.delete(x.target)});f()});document.querySelectorAll(".rl-btn").forEach(function(b){io.observe(b)})}}
document.querySelectorAll(".showgowns").forEach(function(b){b.addEventListener("click",function(){var m=b.previousElementSibling;m.classList.add("open");b.remove()})});
document.documentElement.classList.add("js");
var vids=document.querySelectorAll(".dream-video"),still=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function loadVid(v){if(v.dataset.on)return;v.dataset.on=1;v.innerHTML='<source src="'+v.dataset.webm+'" type="video/webm"><source src="'+v.dataset.mp4+'" type="video/mp4">';v.load();if(!still){var p=v.play();if(p&&p.catch)p.catch(function(){})}}
if(vids.length){if("IntersectionObserver"in window){var vo=new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting){loadVid(x.target);vo.unobserve(x.target)}})},{rootMargin:"250px"});vids.forEach(function(v){vo.observe(v)})}else{vids.forEach(loadVid)}}
document.querySelectorAll(".showall").forEach(function(b){b.addEventListener("click",function(){var t=b.previousElementSibling;t.classList.add("open");b.remove()})});
})();
</script>
